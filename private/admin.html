<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>অ্যাডমিন প্যানেল — MahimHossainBD</title>
<style>
:root{--bg:#07090f;--card:rgba(18,24,36,.78);--line:rgba(255,255,255,.08);--txt:#eef2f9;--mut:#8a97ab;--a:#4f8cff;--a2:#8b5cf6;--gold:#f5c76b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:radial-gradient(900px 500px at 10% -10%,rgba(79,140,255,.18),transparent 60%),radial-gradient(800px 500px at 100% 0,rgba(139,92,246,.16),transparent 55%),var(--bg);color:var(--txt);min-height:100vh;padding-bottom:70px;-webkit-font-smoothing:antialiased}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;background:rgba(10,14,22,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:12px}
.brand i{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--a),var(--a2));display:grid;place-items:center;font-style:normal;font-size:18px;box-shadow:0 6px 20px rgba(79,140,255,.4)}
header h1{font-size:15px;font-weight:800;letter-spacing:.2px}
header h1 small{display:block;font-size:11px;font-weight:600;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}
.btn{border:none;border-radius:11px;padding:11px 16px;font-weight:700;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--a),var(--a2));cursor:pointer;transition:.2s;box-shadow:0 6px 18px rgba(79,140,255,.28);font-family:inherit}
.btn:hover{transform:translateY(-1px);filter:brightness(1.1)}.btn:active{transform:none}
.btn.red{background:linear-gradient(135deg,#f0506e,#d93a5a);box-shadow:0 6px 18px rgba(240,80,110,.25)}
.btn.gray{background:rgba(255,255,255,.07);box-shadow:none;border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:9px}
nav{display:flex;gap:8px;padding:16px 18px 0;overflow-x:auto;max-width:900px;margin:0 auto}
nav button{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--mut);font-weight:700;font-size:13px;padding:10px 18px;border-radius:999px;white-space:nowrap;cursor:pointer;transition:.2s;font-family:inherit}
nav button:hover{color:var(--txt)}
nav button.on{color:#fff;background:linear-gradient(135deg,var(--a),var(--a2));border-color:transparent;box-shadow:0 6px 18px rgba(79,140,255,.3)}
main{max-width:900px;margin:0 auto;padding:18px}
.tab{display:none}.tab.on{display:block;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px;backdrop-filter:blur(10px);box-shadow:0 14px 40px rgba(0,0,0,.35)}
h3{font-size:14px;margin-bottom:14px;color:var(--txt);display:flex;align-items:center;gap:8px;letter-spacing:.3px}
h3::before{content:"";width:4px;height:16px;border-radius:4px;background:linear-gradient(var(--a),var(--a2))}
label{display:block;font-size:11px;font-weight:700;color:var(--mut);margin:14px 0 7px;text-transform:uppercase;letter-spacing:.8px}
input,textarea,select{width:100%;padding:12px 14px;border-radius:12px;background:rgba(5,8,14,.7);border:1px solid var(--line);color:var(--txt);font-size:14px;outline:none;font-family:inherit;transition:.2s}
input:focus,textarea:focus,select:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(79,140,255,.18)}
textarea{min-height:90px;resize:vertical}
input[type=file]{padding:9px;font-size:12px;margin-top:8px;color:var(--mut)}
input[type=checkbox]{width:auto;margin-right:8px;accent-color:var(--a)}
.row{display:grid;grid-template-columns:1fr 1fr 1.4fr auto;gap:8px;margin-bottom:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:none}
.item b{font-size:14px;display:block}.item small{color:var(--mut);font-size:12px;word-break:break-all}
.item .acts{display:flex;gap:6px;flex-shrink:0}
.note{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.6}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:700;display:none;z-index:20;max-width:90%;box-shadow:0 12px 30px rgba(0,0,0,.5)}
#toast.bad{background:linear-gradient(135deg,#f0506e,#d93a5a)}
@media(max-width:560px){.row{grid-template-columns:1fr 1fr}.row input:nth-child(3){grid-column:1/3}.card{padding:16px}}
</style>
</head>
<body>
<header>
  <div class="brand"><i>⚡</i><h1>MahimHossainBD<small>Admin Console</small></h1></div>
  <div><a href="/" class="btn gray sm" style="text-decoration:none;display:inline-block">সাইট</a> <button class="btn red sm" id="logout">লগআউট</button></div>
</header>
<nav id="tabs">
  <button class="on" data-t="profile">👤 প্রোফাইল</button>
  <button data-t="apps">📦 অ্যাপ</button>
  <button data-t="webs">🌐 ওয়েবসাইট</button>
</nav>
<main>
  <section class="tab on" id="t-profile">
    <div class="card">
      <h3>প্রোফাইল</h3>
      <label>লোগো (URL অথবা ফাইল)</label>
      <input id="pLogo" placeholder="https://..."><input type="file" accept="image/*" data-for="pLogo">
      <label>নাম</label><input id="pName">
      <label>ট্যাগলাইন</label><input id="pTag">
      <label>বায়ো (বাংলা)</label><textarea id="pBn"></textarea>
      <label>বায়ো (English)</label><textarea id="pEn"></textarea>
      <label>ইমেইল</label><input id="pMail" type="email">
    </div>
    <div class="card">
      <h3>সোশ্যাল লিংক</h3>
      <div id="links"></div>
      <button class="btn gray sm" id="addLink">+ লিংক যোগ করুন</button>
      <p class="note">আইকন: youtube, tiktok, telegram অথবা link</p>
    </div>
    <button class="btn" id="saveProfile" style="width:100%">✅ প্রোফাইল সেভ করুন</button>
  </section>

  <section class="tab" id="t-apps">
    <div class="card"><h3>অ্যাপ তালিকা</h3><div id="appList">লোড হচ্ছে...</div></div>
    <div class="card">
      <h3>নতুন অ্যাপ যোগ করুন</h3>
      <label>নাম *</label><input id="aName">
      <label>ক্যাটাগরি</label><select id="aCat"><option>App</option><option>Game</option><option>Tool</option></select>
      <label>ভার্সন</label><input id="aVer" value="1.0.0">
      <label>থাম্বনেইল * (URL অথবা ফাইল)</label>
      <input id="aImg" placeholder="https://..."><input type="file" accept="image/*" data-for="aImg">
      <label>APK / ডাউনলোড ফাইল * (URL অথবা ফাইল)</label>
      <input id="aFile" placeholder="https://..."><input type="file" data-for="aFile">
      <p class="note">সব ফাইল (ছবি, ভিডিও, APK) GitHub-এ যায়। আপলোড শেষ না হওয়া পর্যন্ত অপেক্ষা করুন।</p>
      <label>ভিডিও টিউটোরিয়াল (YouTube লিংক অথবা ভিডিও ফাইল)</label><input id="aVid" placeholder="https://..."><input type="file" accept="video/*" data-for="aVid">
      <label>বিবরণ (বাংলা) *</label><textarea id="aDesc"></textarea>
      <label><input type="checkbox" id="aFeat">Featured (পিন)</label>
      <button class="btn" id="saveApp" style="width:100%;margin-top:12px">💾 অ্যাপ তৈরি করুন</button>
    </div>
  </section>

  <section class="tab" id="t-webs">
    <div class="card"><h3>ওয়েবসাইট তালিকা</h3><div id="webList">লোড হচ্ছে...</div></div>
    <div class="card">
      <h3>নতুন ওয়েবসাইট</h3>
      <label>নাম *</label><input id="wName">
      <label>URL *</label><input id="wUrl" placeholder="https://...">
      <label>থাম্বনেইল (URL অথবা ফাইল)</label>
      <input id="wImg" placeholder="https://..."><input type="file" accept="image/*" data-for="wImg">
      <label>বিবরণ (বাংলা)</label><textarea id="wDesc"></textarea>
      <button class="btn" id="saveWeb" style="width:100%;margin-top:12px">💾 সেভ করুন</button>
    </div>
  </section>
</main>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, bad) {
  const t = $('toast');
  t.textContent = msg; t.className = bad ? 'bad' : ''; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 3200);
}

async function api(url, opt = {}) {
  const headers = {};
  if (opt.body && !(opt.body instanceof FormData)) headers['Content-Type'] = 'application/json';
  const r = await fetch(url, { ...opt, headers });
  if (r.status === 401) { location.href = '/admin'; throw new Error('সেশন শেষ, আবার লগইন করুন'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok || d.success === false) throw new Error(d.message || ('ত্রুটি ' + r.status));
  return d;
}
const send = (m, url, body) => api(url, { method: m, body: JSON.stringify(body) });
const run = async (fn, ok) => { try { await fn(); if (ok) toast(ok); } catch (e) { toast('❌ ' + e.message, true); } };

// ট্যাব
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.id === 't-' + b.dataset.t));
});

// ফাইল আপলোড → URL ঘরে বসে যায়
let pending = 0;
document.addEventListener('change', async e => {
  const f = e.target; if (f.type !== 'file' || !f.files[0]) return;
  let st = f.nextElementSibling;
  if (!st || !st.classList.contains('ust')) { st = document.createElement('div'); st.className = 'ust note'; f.after(st); }
  pending++; st.style.color = '#fbbf24'; st.textContent = '⏳ আপলোড হচ্ছে, অপেক্ষা করুন...';
  try {
    const fd = new FormData(); fd.append('file', f.files[0]);
    const d = await api('/api/upload', { method: 'POST', body: fd });
    $(f.dataset.for).value = d.url;
    st.style.color = '#22c55e'; st.textContent = '✅ আপলোড সম্পন্ন';
  } catch (err) {
    st.style.color = '#ef4444'; st.textContent = '❌ আপলোড হয়নি: ' + err.message;
  } finally { pending--; }
});

// প্রোফাইল ও লিংক
function linkRow(l = {}) {
  const d = document.createElement('div'); d.className = 'row';
  d.innerHTML = '<input placeholder="নাম" value="' + esc(l.name) + '"><input placeholder="@handle" value="' + esc(l.username_handle || l.user) + '">' +
    '<input placeholder="URL" value="' + esc(l.url) + '"><button class="btn red sm" type="button">✕</button>';
  d.querySelector('button').onclick = () => d.remove();
  $('links').appendChild(d);
}
$('addLink').onclick = () => linkRow();

async function loadProfile() {
  const d = await api('/api/profile'), p = d.profile || {};
  $('pLogo').value = p.logo_url || ''; $('pName').value = p.name || ''; $('pTag').value = p.tagline || '';
  $('pBn').value = p.about_bn || ''; $('pEn').value = p.about_en || ''; $('pMail').value = p.email || '';
  $('links').innerHTML = ''; (d.links || []).forEach(linkRow);
}
$('saveProfile').onclick = () => run(async () => {
  const links = [...$('links').children].map(r => {
    const [n, u, url] = r.querySelectorAll('input');
    const name = n.value.trim(), lu = url.value.trim();
    const icon = ['youtube', 'tiktok', 'telegram'].find(k => (name + lu).toLowerCase().includes(k)) || 'link';
    return { name, user: u.value.trim(), url: lu, icon };
  }).filter(l => l.name && l.url);
  await send('PUT', '/api/profile', {
    name: $('pName').value, tagline: $('pTag').value, about_bn: $('pBn').value, about_en: $('pEn').value,
    email: $('pMail').value, logo_url: $('pLogo').value, links
  });
  await loadProfile();
}, '✅ প্রোফাইল সেভ হয়েছে');

// অ্যাপ
async function loadApps() {
  const d = await api('/api/apps');
  $('appList').innerHTML = d.data.length ? d.data.map(a =>
    '<div class="item"><div><b>' + (a.featured ? '📌 ' : '') + esc(a.name) + '</b><small>' + esc(a.category) + ' • v' + esc(a.version) + '</small></div>' +
    '<div class="acts"><button class="btn gray sm" data-pin="' + a.id + '">পিন</button><button class="btn red sm" data-del="' + a.id + '">মুছুন</button></div></div>'
  ).join('') : '<p class="note">কোনো অ্যাপ নেই।</p>';
}
$('appList').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.pin) run(async () => { await send('PATCH', '/api/apps/' + b.dataset.pin + '/pin'); await loadApps(); }, '✅ আপডেট হয়েছে');
  if (b.dataset.del && confirm('এই অ্যাপ মুছে ফেলবেন?')) run(async () => { await send('DELETE', '/api/apps/' + b.dataset.del); await loadApps(); }, '🗑️ মুছে ফেলা হয়েছে');
});
$('saveApp').onclick = () => run(async () => {
  const v = id => $(id).value.trim();
  if (pending > 0) throw new Error('ফাইল আপলোড এখনো শেষ হয়নি, অপেক্ষা করুন');
  const miss = [['aName', 'নাম'], ['aImg', 'থাম্বনেইল'], ['aFile', 'APK/ফাইল'], ['aDesc', 'বিবরণ']].filter(x => !v(x[0])).map(x => x[1]);
  if (miss.length) throw new Error('এগুলো খালি: ' + miss.join(', '));
  await send('POST', '/api/apps', {
    name: v('aName'), category: $('aCat').value, version: v('aVer') || '1.0.0', image_url: v('aImg'),
    file_url: v('aFile'), video_url: v('aVid'), description_bn: v('aDesc'), featured: $('aFeat').checked
  });
  ['aName', 'aImg', 'aFile', 'aVid', 'aDesc'].forEach(i => $(i).value = ''); document.querySelectorAll('.ust').forEach(x => x.textContent = ''); document.querySelectorAll('input[type=file]').forEach(x => x.value = ''); $('aFeat').checked = false;
  await loadApps();
}, '✅ অ্যাপ তৈরি হয়েছে');

// ওয়েবসাইট
async function loadWebs() {
  const d = await api('/api/websites');
  $('webList').innerHTML = d.data.length ? d.data.map(w =>
    '<div class="item"><div><b>' + esc(w.name) + '</b><small>' + esc(w.url) + '</small></div>' +
    '<div class="acts"><button class="btn red sm" data-del="' + w.id + '">মুছুন</button></div></div>'
  ).join('') : '<p class="note">কোনো ওয়েবসাইট নেই।</p>';
}
$('webList').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !b.dataset.del) return;
  if (confirm('এই ওয়েবসাইট মুছে ফেলবেন?')) run(async () => { await send('DELETE', '/api/websites/' + b.dataset.del); await loadWebs(); }, '🗑️ মুছে ফেলা হয়েছে');
});
$('saveWeb').onclick = () => run(async () => {
  const v = id => $(id).value.trim();
  if (!v('wName') || !v('wUrl')) throw new Error('নাম ও URL আবশ্যক');
  await send('POST', '/api/websites', { name: v('wName'), url: v('wUrl'), thumbnail_url: v('wImg'), description_bn: v('wDesc') });
  ['wName', 'wUrl', 'wImg', 'wDesc'].forEach(i => $(i).value = '');
  await loadWebs();
}, '✅ সেভ হয়েছে');


$('logout').onclick = async () => { try { await send('POST', '/api/auth/logout'); } catch (e) {} location.href = '/admin'; };

run(async () => { await api('/api/auth/me'); await Promise.all([loadProfile(), loadApps(), loadWebs()]); });
</script>
</body>
  </html>
