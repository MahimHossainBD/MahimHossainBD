<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Admin Login — MahimHossainBD</title>
    
    <!-- সম্পূর্ণ ফ্রি Google Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: radial-gradient(circle at 50% 0%, rgba(22,119,255,0.25), transparent 45%), #05070b;
            color: #ffffff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .login-card {
            background: #0d1118; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
            padding: 35px 30px; width: min(440px, 100%); box-shadow: 0 20px 60px rgba(0,0,0,0.7);
        }
        .logo-box { text-align: center; margin-bottom: 20px; }
        .logo-box img { width: 75px; height: 75px; border-radius: 50%; border: 2px solid #1677ff; }
        h2 { font-size: 22px; text-align: center; margin-bottom: 6px; }
        .sub { text-align: center; color: #8d9aaa; font-size: 13px; margin-bottom: 24px; }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 11px; text-transform: uppercase; font-weight: 700; color: #dce5f2; margin-bottom: 7px; }
        .field input {
            width: 100%; padding: 12px 14px; border-radius: 10px; background: #070a10;
            border: 1px solid rgba(255,255,255,0.12); color: #fff; font-size: 14px; outline: none;
        }
        .field input:focus { border-color: #1677ff; box-shadow: 0 0 0 3px rgba(22,119,255,0.2); }
        .btn-submit {
            width: 100%; padding: 13px; border-radius: 10px; background: linear-gradient(135deg, #1677ff, #0d63dc);
            color: #fff; font-weight: 800; font-size: 15px; border: none; cursor: pointer; transition: .25s; margin-top: 8px;
        }
        .btn-submit:hover { opacity: 0.92; transform: translateY(-1px); }
        .err-msg { color: #ef4444; font-size: 13px; text-align: center; margin-top: 12px; display: none; }
        .back-link { display: block; text-align: center; color: #8d9aaa; font-size: 13px; margin-top: 18px; text-decoration: none; }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-box">
            <img src="https://i.postimg.cc/X7kpKwx7/Picsart-26-09-07-22-20-41-182.jpg" alt="Logo">
        </div>
        <h2>🔥 Firebase অ্যাডমিন লগইন</h2>
        <p class="sub">MahimHossainBD Control Center (100% Free)</p>

        <form id="loginForm">
            <div class="field">
                <label>ফায়ারবেস ইমেইল (Admin Email)</label>
                <input type="email" id="email" placeholder="MahimHossainBD@gmail.com" required autocomplete="username">
            </div>
            <div class="field">
                <label>পাসওয়ার্ড (Password)</label>
                <input type="password" id="password" placeholder="Firebase Password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-submit" id="btnSubmit">লগইন করুন</button>
        </form>

        <div class="err-msg" id="errMsg"></div>
        <a href="/" class="back-link">← মূল ওয়েবসাইটে ফিরে যান</a>
    </div>

    <script>
        // আপনার ফ্রি Firebase কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyBNWiaiL6IB2BR-dzHKBzL01MPF1urs7RY",
            authDomain: "mahimhossain-bd.firebaseapp.com",
            databaseURL: "https://mahimhossain-bd-default-rtdb.firebaseio.com",
            projectId: "mahimhossain-bd",
            storageBucket: "mahimhossain-bd.firebasestorage.app",
            messagingSenderId: "445369690414",
            appId: "1:445369690414:web:f4e0cb9c8e8295c7cab2bf"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        const form = document.getElementById('loginForm');
        const errMsg = document.getElementById('errMsg');
        const btnSubmit = document.getElementById('btnSubmit');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errMsg.style.display = 'none';
            btnSubmit.textContent = 'Firebase যাচাই হচ্ছে...';
            btnSubmit.disabled = true;

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                // ১. সরাসরি Google Firebase-এ লগইন ভেরিফিকেশন (১০০% ফ্রি)
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // ২. সার্ভার সেশন কুকি তৈরি
                const idToken = await user.getIdToken();
                const res = await fetch('/api/auth/firebase-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken })
                });
                const out = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(out.message || 'সার্ভার সেশন তৈরি করতে সমস্যা হয়েছে!');

                // ৩. সরাসরি এডমিন প্যানেলে প্রবেশ
                window.location.href = '/admin';
            } catch (err) {
                console.error(err);
                errMsg.textContent = (err.code && String(err.code).startsWith('auth/')) ? '❌ ভুল ইমেইল বা পাসওয়ার্ড! (Firebase-এ ইমেইল ও পাসওয়ার্ড তৈরি করেছেন কি?)' : '❌ ' + err.message;
                errMsg.style.display = 'block';
            } finally {
                btnSubmit.textContent = 'লগইন করুন';
                btnSubmit.disabled = false;
            }
        });
    </script>
</body>
</html>
