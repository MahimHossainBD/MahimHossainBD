<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MahimHossainBD</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
    --blue:#1677ff; --blue-2:#0d63dc; --dark:#05070b; --dark-card:#0d1118; --dark-2:#070a10;
    --white:#ffffff; --text:#dce5f2; --muted:#8d9aaa; --border:rgba(255,255,255,0.09);
    --border-strong:rgba(255,255,255,0.16); --green:#22c55e; --red:#ef4444; --purple:#8b5cf6;
    --orange:#f59e0b; --grad-blue:linear-gradient(135deg,#1677ff,#0d63dc);
    --grad-orange:linear-gradient(135deg,#f59e0b,#d97706); --grad-green:linear-gradient(135deg,#22c55e,#16a34a);
}
body {
    font-family: Arial, Helvetica, sans-serif;
    background: radial-gradient(circle at 50% 0%, rgba(22,119,255,0.20), transparent 35%), var(--dark);
    color: var(--white); min-height: 100vh; overflow-x: hidden;
}
a { text-decoration:none; color:inherit; }
button { font-family:inherit; cursor:pointer; border:none; }
.container { width:min(1100px, 92%); margin:auto; }

.topnav-wrap {
    position:sticky; top:0; z-index:100; background:rgba(5,7,11,0.85);
    backdrop-filter:blur(14px); border-bottom:1px solid var(--border); padding:12px 0;
}
.topnav-inner { display:flex; justify-content:space-between; align-items:center; gap:12px; }
.topnav { display:flex; justify-content:center; align-items:center; gap:8px; flex:1; overflow-x:auto; }
.nav-btn {
    padding:11px 20px; border-radius:12px; background:transparent; color:var(--muted);
    font-size:14px; font-weight:700; display:flex; align-items:center; gap:7px;
}
.nav-btn.active { background:var(--grad-blue); color:#fff; box-shadow:0 6px 18px rgba(22,119,255,0.4); }

.lang-switch { display:flex; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:11px; padding:3px; }
.lang-btn { padding:7px 12px; border-radius:8px; background:transparent; color:var(--muted); font-size:12px; font-weight:800; cursor:pointer; }
.lang-btn.active { background:var(--grad-blue); color:#fff; }

header { padding:34px 0 15px; text-align:center; }
.logo {
    width:110px; height:110px; object-fit:cover; border-radius:50%;
    border:3px solid var(--blue); box-shadow:0 0 40px rgba(22,119,255,0.4);
    animation:logoPulse 4s ease-in-out infinite;
}
@keyframes logoPulse { 0%,100% { box-shadow:0 0 40px rgba(22,119,255,0.4); } 50% { box-shadow:0 0 55px rgba(22,119,255,0.7); } }
.name { margin-top:18px; font-size:clamp(28px,6vw,48px); font-weight:800; background:linear-gradient(135deg,#fff,#a9c9ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.tagline { margin-top:10px; color:var(--blue); font-size:clamp(15px,3vw,20px); font-weight:600; }
.about { max-width:700px; margin:18px auto 0; color:var(--muted); line-height:1.8; font-size:16px; white-space:pre-line; }

.section { padding:35px 0; }
.section-title { text-align:center; font-size:25px; margin-bottom:22px; }
.section-title span { color:var(--blue); }

.links { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:18px; }
.link-card { background:rgba(255,255,255,0.04); border:1px solid var(--border); border-radius:20px; padding:24px 20px; text-align:center; }
.icon { width:58px; height:58px; margin:0 auto 15px; border-radius:16px; background:rgba(22,119,255,0.12); border:1px solid rgba(22,119,255,0.25); display:flex; align-items:center; justify-content:center; color:var(--blue); font-size:26px; }
.visit-btn { display:inline-block; padding:10px 18px; border-radius:10px; background:var(--grad-blue); color:white; font-size:14px; font-weight:700; margin-top:12px; }

.search-wrap { max-width:520px; margin:0 auto 18px; }
.search-wrap input { width:100%; padding:12px 18px; border-radius:14px; background:var(--dark-2); border:1px solid var(--border); color:#fff; outline:none; }
.apps-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:18px; }
.app-card { background:rgba(255,255,255,0.04); border:1px solid var(--border); border-radius:20px; overflow:hidden; display:flex; flex-direction:column; position:relative; }
.app-thumb { width:100%; height:150px; object-fit:cover; border-bottom:1px solid var(--border); }
.app-body { padding:16px 18px; flex:1; display:flex; flex-direction:column; }
.meta-row { display:flex; gap:8px; margin-bottom:8px; font-size:11px; }
.tag-pill { padding:3px 9px; border-radius:20px; background:rgba(22,119,255,0.15); color:#7ab8ff; font-weight:700; }
.desc { color:var(--muted); font-size:13px; line-height:1.6; margin-bottom:14px; flex:1; }

.btn-sm { padding:8px 14px; border-radius:9px; font-size:13px; font-weight:700; display:inline-flex; align-items:center; gap:5px; text-decoration:none; }
.btn-dl { background:var(--grad-green); color:#fff; }
.btn-vid { background:rgba(239,68,68,0.15); color:#fca5a5; border:1px solid rgba(239,68,68,0.4); }

.contact { margin:10px auto 45px; max-width:650px; background:var(--dark-card); border:1px solid var(--border); border-radius:20px; padding:24px; text-align:center; }
.email { color:var(--blue); font-size:15px; }

footer { border-top:1px solid var(--border); padding:22px 0; text-align:center; color:var(--muted); font-size:13px; }
.footer-admin { display:inline-block; margin-top:8px; color:#1a2330; font-size:11px; cursor:pointer; text-decoration:none; }

.video-modal { position:fixed; inset:0; background:rgba(0,0,0,0.9); display:none; align-items:center; justify-content:center; padding:20px; z-index:1500; }
.video-box { width:min(900px,100%); background:#0d1118; border:1px solid var(--border); border-radius:16px; padding:16px; }
.video-box iframe, .video-box video { width:100%; aspect-ratio:16/9; border-radius:10px; border:none; }
</style>
</head>
<body>

<div class="topnav-wrap">
    <div class="container">
        <div class="topnav-inner">
            <nav class="topnav">
                <button class="nav-btn active" data-view="profile">👤 <span id="navProfile">প্রোফাইল</span></button>
                <button class="nav-btn" data-view="store">📦 <span id="navStore">অ্যাপ স্টোর</span></button>
                <button class="nav-btn" data-view="web">🌐 <span id="navWeb">ওয়েবসাইট</span></button>
            </nav>
            <div class="lang-switch">
                <button class="lang-btn" data-lang="en">EN</button>
                <button class="lang-btn active" data-lang="bn">বাং</button>
            </div>
        </div>
    </div>
</div>

<div id="view-profile">
    <header>
        <div class="container">
            <img class="logo" id="pfLogo" src="" alt="Logo">
            <h1 class="name" id="pfName">MahimHossainBD</h1>
            <div class="tagline" id="pfTagline">Developer and create app</div>
            <p class="about" id="pfAbout"></p>
        </div>
    </header>
    <main class="container">
        <section class="section">
            <h2 class="section-title">Online <span>Links</span></h2>
            <div class="links" id="linksGrid"></div>
        </section>
        <section class="contact">
            <h2 style="font-size:20px; margin-bottom:8px;">Contact</h2>
            <a class="email" id="pfEmail" href="#">MahimHossainBD@gmail.com</a>
        </section>
    </main>
</div>

<div id="view-store" style="display:none;">
    <main class="container">
        <section class="section">
            <h2 class="section-title">📦 অ্যাপ <span>স্টোর</span></h2>
            <div class="search-wrap">
                <input type="text" id="appSearch" placeholder="অ্যাপের নাম দিয়ে খুঁজুন...">
            </div>
            <div id="appsGrid" class="apps-grid"></div>
        </section>
    </main>
</div>

<div id="view-web" style="display:none;">
    <main class="container">
        <section class="section">
            <h2 class="section-title">🌐 ওয়েবসাইট <span>স্টোর</span></h2>
            <div id="webGrid" class="apps-grid"></div>
        </section>
    </main>
</div>

<!-- VIDEO MODAL -->
<div class="video-modal" id="videoModal">
    <div class="video-box">
        <div id="videoContainer"></div>
        <button onclick="closeVideo()" style="background:#ef4444; color:#fff; padding:8px 18px; border-radius:8px; margin-top:10px; cursor:pointer;">✕ Close</button>
    </div>
</div>

<footer>
    © <span id="year"></span> MahimHossainBD. All rights reserved.
    <br>
    <a href="/login" class="footer-admin">· admin portal ·</a>
</footer>

<script>
let currentLang = 'bn';
let cachedProfile = {};

async function initSite() {
    document.getElementById('year').textContent = new Date().getFullYear();

    // 1. প্রোফাইল লোড
    const pData = await (await fetch('/api/profile')).json();
    if (pData.success) {
        cachedProfile = pData.profile;
        document.getElementById('pfLogo').src = pData.profile.logo_url;
        document.getElementById('pfName').textContent = pData.profile.name;
        document.getElementById('pfTagline').textContent = pData.profile.tagline;
        document.getElementById('pfAbout').textContent = currentLang === 'bn' ? pData.profile.about_bn : pData.profile.about_en;
        document.getElementById('pfEmail').textContent = pData.profile.email;
        document.getElementById('pfEmail').href = `mailto:${pData.profile.email}`;

        const lGrid = document.getElementById('linksGrid');
        lGrid.innerHTML = '';
        (pData.links || []).forEach(l => {
            lGrid.innerHTML += `
                <div class="link-card">
                    <div class="icon">🔗</div>
                    <h3>${l.name}</h3>
                    <p style="color:var(--muted); font-size:13px;">${l.username_handle || ''}</p>
                    <a class="visit-btn" href="${l.url}" target="_blank">Visit</a>
                </div>
            `;
        });
    }

    // 2. অ্যাপস লোড
    const aData = await (await fetch('/api/apps')).json();
    const aGrid = document.getElementById('appsGrid');
    aGrid.innerHTML = '';
    (aData.data || []).forEach(a => {
        aGrid.innerHTML += `
            <div class="app-card">
                <img class="app-thumb" src="${a.image_url}">
                <div class="app-body">
                    <h3>${a.name}</h3>
                    <div class="meta-row"><span class="tag-pill">${a.category}</span></div>
                    <div class="desc">${a.description_bn}</div>
                    <div style="display:flex; gap:8px;">
                        <a class="btn-sm btn-dl" href="${a.file_url}" target="_blank" download>⬇️ ডাউনলোড</a>
                        ${a.video_url ? `<button class="btn-sm btn-vid" onclick="playVideo('${a.video_url}')">🎬 ভিডিও</button>` : ''}
                    </div>
                </div>
            </div>
        `;
    });

    // 3. ওয়েবসাইট লোড
    const wData = await (await fetch('/api/websites')).json();
    const wGrid = document.getElementById('webGrid');
    wGrid.innerHTML = '';
    (wData.data || []).forEach(w => {
        wGrid.innerHTML += `
            <div class="app-card">
                <img class="app-thumb" src="${w.thumbnail_url || 'https://i.postimg.cc/X7kpKwx7/Picsart-26-09-07-22-20-41-182.jpg'}">
                <div class="app-body">
                    <h3>${w.name}</h3>
                    <div class="desc">${w.description_bn || ''}</div>
                    <a class="btn-sm btn-dl" href="${w.url}" target="_blank">🌐 ভিজিট</a>
                </div>
            </div>
        `;
    });
}

function playVideo(url) {
    const vc = document.getElementById('videoContainer');
    let m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
    if (m) {
        vc.innerHTML = `<iframe src="https://www.youtube.com/embed/${m[1]}" allowfullscreen></iframe>`;
    } else {
        vc.innerHTML = `<video src="${url}" controls autoplay></video>`;
    }
    document.getElementById('videoModal').style.display = 'flex';
}

function closeVideo() {
    document.getElementById('videoModal').style.display = 'none';
    document.getElementById('videoContainer').innerHTML = '';
}

// ভিউ সুইচিং
document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        ['view-profile', 'view-store', 'view-web'].forEach(id => document.getElementById(id).style.display = 'none');
        document.getElementById(`view-${btn.dataset.view}`).style.display = 'block';
    });
});

// ভাষা পরিবর্তন
document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentLang = btn.dataset.lang;
        document.getElementById('pfAbout').textContent = currentLang === 'bn' ? cachedProfile.about_bn : cachedProfile.about_en;
    });
});

initSite();
</script>
</body>
                  </html>
