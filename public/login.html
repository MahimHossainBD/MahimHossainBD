<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন লগইন — MahimHossainBD</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: radial-gradient(circle at 50% 0%, rgba(22,119,255,0.2), transparent 45%), #05070b;
            color: #ffffff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .login-card {
            background: #0d1118; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
            padding: 35px 30px; width: min(440px, 100%); box-shadow: 0 20px 60px rgba(0,0,0,0.7);
        }
        .logo-box { text-align: center; margin-bottom: 20px; }
        .logo-box img { width: 75px; height: 75px; border-radius: 50%; border: 2px solid #1677ff; }
        h2 { font-size: 22px; text-align: center; margin-bottom: 6px; }
        .sub { text-align: center; color: #8d9aaa; font-size: 13px; margin-bottom: 24px; }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 11px; text-transform: uppercase; font-weight: 700; color: #dce5f2; margin-bottom: 7px; }
        .field input {
            width: 100%; padding: 12px 14px; border-radius: 10px; background: #070a10;
            border: 1px solid rgba(255,255,255,0.12); color: #fff; font-size: 14px; outline: none;
        }
        .field input:focus { border-color: #1677ff; box-shadow: 0 0 0 3px rgba(22,119,255,0.2); }
        .btn-submit {
            width: 100%; padding: 13px; border-radius: 10px; background: linear-gradient(135deg, #1677ff, #0d63dc);
            color: #fff; font-weight: 800; font-size: 15px; border: none; cursor: pointer; transition: .25s; margin-top: 8px;
        }
        .btn-submit:hover { opacity: 0.92; transform: translateY(-1px); }
        .back-link { display: block; text-align: center; color: #8d9aaa; font-size: 13px; margin-top: 18px; text-decoration: none; }
        .back-link:hover { color: #fff; }
        .err-msg { color: #ef4444; font-size: 13px; text-align: center; margin-top: 12px; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-box">
            <img src="https://i.postimg.cc/X7kpKwx7/Picsart-26-09-07-22-20-41-182.jpg" alt="Logo">
        </div>
        <h2>🔐 অ্যাডমিন পোর্টাল</h2>
        <p class="sub">MahimHossainBD Server Control</p>

        <form id="credForm">
            <div class="field">
                <label>ইউজারনেম</label>
                <input type="text" id="username" placeholder="Username (e.g. MrMahimFire)" required autocomplete="off">
            </div>
            <div class="field">
                <label>পাসওয়ার্ড</label>
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-submit" id="btnCred">লগইন করুন</button>
        </form>

        <form id="otpForm" style="display:none;">
            <div class="field">
                <label>Security 6-Digit Email OTP</label>
                <input type="text" id="otpCode" placeholder="123456" maxlength="6" style="letter-spacing:6px; font-weight:bold; font-size:20px; text-align:center;">
            </div>
            <button type="submit" class="btn-submit" id="btnOtp">Verify & Open Admin</button>
        </form>

        <div class="err-msg" id="errMsg"></div>
        <a href="/firebase-login" class="back-link">Firebase দিয়ে লগইন</a>
        <a href="/" class="back-link">← মূল ওয়েবসাইটে ফিরে যান</a>
    </div>

    <script>
        let currentEmail = '';
        const credForm = document.getElementById('credForm');
        const otpForm = document.getElementById('otpForm');
        const errMsg = document.getElementById('errMsg');

        credForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errMsg.style.display = 'none';
            document.getElementById('btnCred').textContent = 'যাচাই হচ্ছে...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.message || 'ভুল ইউজারনেম বা পাসওয়ার্ড!');

                if (data.requireOtp) {
                    currentEmail = data.email;
                    credForm.style.display = 'none';
                    otpForm.style.display = 'block';
                } else {
                    window.location.href = '/admin';
                }
            } catch (err) {
                errMsg.textContent = err.message;
                errMsg.style.display = 'block';
            } finally {
                document.getElementById('btnCred').textContent = 'লগইন করুন';
            }
        });

        otpForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errMsg.style.display = 'none';
            document.getElementById('btnOtp').textContent = 'ভেরিফাই হচ্ছে...';

            try {
                const res = await fetch('/api/auth/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, otp: document.getElementById('otpCode').value.trim() })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.message || 'ভুল OTP কোড!');

                window.location.href = '/admin';
            } catch (err) {
                errMsg.textContent = err.message;
                errMsg.style.display = 'block';
            } finally {
                document.getElementById('btnOtp').textContent = 'Verify & Open Admin';
            }
        });
    </script>
</body>
</html>
